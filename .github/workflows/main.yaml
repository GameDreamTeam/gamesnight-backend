name: Push backend docker image to ecr

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build docker image
        run: |
          docker build -t 528424611106.dkr.ecr.eu-north-1.amazonaws.com/gamesnight:backend .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: 'arn:aws:iam::528424611106:role/GITHUB_USER'
          role-session-name: githubrolesession
          aws-region: eu-north-1    

      - uses: aws-actions/amazon-ecr-login@v1

      - name: Push to ECR
        run: |
          docker push 528424611106.dkr.ecr.eu-north-1.amazonaws.com/gamesnight:backend
